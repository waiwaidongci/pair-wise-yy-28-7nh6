<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>影视拍摄连续性</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f3f4f7}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#4b2d6f;color:#fff}pre{white-space:pre-wrap;max-height:420px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}table{border-collapse:collapse;width:100%;margin:8px 0}td,th{border:1px solid #ddd;padding:5px 8px;text-align:left}.cross{background:#fde8e8}.inh{color:#777}</style><h1>影视拍摄连续性管理</h1><section><h2>全片叙事检查</h2><input id="production" type="number" placeholder="项目 ID"><button onclick="filmCheck()">全片检查</button><button onclick="report()">全片报告</button><button onclick="filmConflicts()">跨场次冲突</button><div id="chain"></div><div id="cross"></div><pre id="state"></pre></section><section><h2>叙事顺序调整</h2><div class="grid"><input id="rscene" type="number" placeholder="场次 ID"><input id="rsceneorder" type="number" placeholder="新叙事顺序"><input id="rshot" type="number" placeholder="镜头 ID"><input id="rshotorder" type="number" placeholder="新叙事顺序"><input id="ruser" type="number" placeholder="场记/制片 ID"></div><button onclick="reorderScene()">调整场次顺序</button><button onclick="reorderShot()">调整镜头顺序</button><pre id="reorder"></pre></section><section><h2>单场状态与冲突</h2><div class="grid"><input id="scene" type="number" placeholder="场次 ID"><input id="shot" type="number" placeholder="镜头 ID"><input id="element" type="number" placeholder="元素 ID"><input id="user" type="number" placeholder="场记/制片 ID"><input id="value" placeholder="状态值"><input id="numeric" type="number" step="0.1" placeholder="数值"><input id="conflict" type="number" placeholder="冲突 ID"><input id="reviewer" type="number" placeholder="审片人 ID"><input id="reason" placeholder="理由"></div><button onclick="state()">设置状态并检测</button><button onclick="check()">重新检查场次</button><button onclick="lock()">锁定镜头</button><button onclick="exempt()">批准豁免</button><pre id="result"></pre></section><section><h2>调整方案</h2><input id="newvalue" placeholder="新状态"><input id="newnumeric" type="number" step="0.1" placeholder="新数值"><button onclick="propose()">提出方案</button><input id="plan" type="number" placeholder="方案 ID"><button onclick="approve()">批准方案</button><pre id="extra"></pre></section><script>const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);async function get(u,e='#result'){show(e,await(await fetch(u)).json())}async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function renderChain(r){const rows=(r.film_chain||[]).map(s=>'<tr><td>'+esc(s.scene_number)+'</td><td>'+esc(s.shot_code)+(s.status==='locked'?' 🔒':'')+'</td><td>'+(s.states||[]).map(t=>esc(t.element_name)+': '+esc(t.state_value)+(t.numeric_value!=null?'('+t.numeric_value+')':'')+(t.inherited?' <span class=inh>←沿用 '+esc(t.source_shot_code)+'</span>':'')).join('<br>')+'</td></tr>').join('');document.querySelector('#chain').innerHTML=rows?'<h3>全片叙事链</h3><table><tr><th>场次</th><th>镜头</th><th>有效状态</th></tr>'+rows+'</table>':''}function renderCross(list){const rows=list.map(c=>'<tr class=cross><td>#'+c.id+'</td><td>'+esc(c.element_name)+'</td><td>'+esc(c.from_scene_number)+'/'+esc(c.from_shot_code)+' → '+esc(c.to_scene_number)+'/'+esc(c.to_shot_code)+'</td><td>'+esc(c.detail)+'</td><td>'+esc(c.status)+'</td></tr>').join('');document.querySelector('#cross').innerHTML=rows?'<h3>跨场次冲突</h3><table><tr><th>ID</th><th>元素</th><th>位置</th><th>详情</th><th>状态</th></tr>'+rows+'</table>':''}async function report(){const r=await(await fetch('/api/productions/'+production.value+'/continuity')).json();show('#state',r);renderChain(r);renderCross(r.cross_scene_conflicts||[])}async function filmCheck(){const r=await(await fetch('/api/productions/'+production.value+'/check',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json();show('#state',r);renderCross((r.conflicts||[]).filter(c=>c.cross_scene))}async function filmConflicts(){const r=await(await fetch('/api/productions/'+production.value+'/conflicts')).json();show('#state',r);renderCross((r.conflicts||[]).filter(c=>c.cross_scene))}function reorderScene(){post('/api/scenes/'+rscene.value+'/reorder',{narrative_order:+rsceneorder.value,user_id:+ruser.value},'#reorder')}function reorderShot(){post('/api/shots/'+rshot.value+'/reorder',{narrative_order:+rshotorder.value,user_id:+ruser.value},'#reorder')}function state(){post('/api/shots/'+shot.value+'/states',{element_id:+element.value,state_value:value.value,numeric_value:numeric.value?+numeric.value:null,note:reason.value,user_id:+user.value})}function check(){post('/api/scenes/'+scene.value+'/check',{})}function lock(){post('/api/shots/'+shot.value+'/lock',{user_id:+user.value})}function exempt(){post('/api/conflicts/'+conflict.value+'/exemptions',{reason:reason.value,reviewer_id:+reviewer.value})}function propose(){post('/api/conflicts/'+conflict.value+'/plans',{new_value:newvalue.value,numeric_value:newnumeric.value?+newnumeric.value:null,reason:reason.value,user_id:+user.value})}function approve(){post('/api/plans/'+plan.value+'/review',{approve:true,reviewer_id:+reviewer.value,note:reason.value},'#extra')}report()</script></html>
